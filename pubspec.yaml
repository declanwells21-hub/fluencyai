name: fluency
description: FLUENCY - AI language tutor app
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.1
  audioplayers: ^6.0.0
  record: ^5.1.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  flutter_tts: ^4.2.0
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/phrases/
    - assets/phrases/audio/
    - assets/grammar/
    - assets/scenarios/
