    </div>
  </header>

      <div style="width:96px;height:96px;"><div class="sc-host" style="width:100%;height:100%"><div style="position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;min-width:24px;min-height:24px;">
  
    <div style="position:relative;height:100%;max-width:100%;aspect-ratio:1/1;">
      
        <div data-flc-anim="1" style="position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle at 50% 50%, rgba(37,215,155,0.26) 0%, rgba(37,215,155,0.08) 42%, rgba(11,34,51,0) 70%);animation:none;pointer-events:none;"></div>
      
      <div style="position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(120% 95% at 50% 8%, #18A99A 0%, #0F5462 38%, #0D3346 68%, #0B2233 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -18px 28px -10px rgba(4,18,27,.45), 0 18px 36px -18px rgba(4,18,27,.65);display:flex;align-items:flex-end;justify-content:center;">
        <div style="position:absolute;left:14%;right:14%;top:6%;height:38%;border-radius:50%;background:radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 70%);pointer-events:none;"></div>
        <div data-flc-anim="1" style="position:relative;width:76%;aspect-ratio:300/330;margin-bottom:-6%;animation:flcFloat 5s ease-in-out infinite;">
          <div class="sc-host-x" style="position:absolute;inset:0;width:100%;height:100%"><fl-coach character="mia" skin="2" hair="bob" hair-color="ink" outfit="casual" glasses="round" age="teen" beard="none" state="happy" crop="bust"></fl-coach></div>
        </div>
      </div>
    </div>
  
  </div></div></div>
      <div style="justify-self:start;max-width:min(720px,100%);display:grid;gap:4px;padding:14px 18px;border-radius:6px 22px 22px 22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);">
        <span style="font:700 20px/1.25 var(--font-display);color:#fff;">One moment.</span>
        <span style="font:400 16px/1.5 var(--font-body);color:var(--ink-300);">Opening your partner hub.</span>
      </div>
    </div>

    
      <div style="display:grid;gap:14px;padding:22px;border-radius:24px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);max-width:720px;" role="status" aria-live="polite">
        <span style="font:700 20px/1.25 var(--font-display);color:#fff;">Loading your partner hub</span>
        
        <span style="font:400 16px/1.55 var(--font-body);color:var(--ink-300);">This only takes a second.</span>
